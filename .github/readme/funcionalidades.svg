<text x="68" y="292" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Digita pelo teclado, apaga o último dígito com<tspan font-weight="700" fill="#ece9e4"> ⌫</tspan><tspan font-weight="700" fill="#ece9e4"> /</tspan></text>
<text x="68" y="314" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">Backspace</tspan> e limpa tudo com<tspan font-weight="700" fill="#ece9e4"> Esc</tspan>.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.984;1" dur="0.6s" fill="freeze"/>
<rect x="624.5" y="234.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="644" y="256" width="8" height="8" fill="#d97757"/>
