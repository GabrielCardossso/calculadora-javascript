<text x="68" y="410" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Botões padronizados numa grade 4x4, com CSS responsivo e</text>
<text x="68" y="432" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">melhorias de acessibilidade.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.988;1" dur="0.8s" fill="freeze"/>
<rect x="624.5" y="352.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="644" y="374" width="8" height="8" fill="#d97757"/>
<text x="662" y="383" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Resultado em pt-BR</text>
<text x="644" y="410" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">O resultado aparece no formato brasileiro (vírgula</text>
<text x="644" y="432" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">decimal) e a conta continua a partir dele.</text>
