<text x="644" y="292" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Bloqueia operadores repetidos e pontos duplicados para a</text>
<text x="644" y="314" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">conta não quebrar.</text>
